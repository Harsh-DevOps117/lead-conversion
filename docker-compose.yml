version: '3.7'

services:
  amqp:
    image: rabbitmq:3.8.2-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  db:
    image: postgres:11-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./db-data:/var/lib/postgresql/data
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
